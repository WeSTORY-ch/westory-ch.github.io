<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スキル図鑑｜WeSTORY</title>
<meta name="description" content="テリーのワンダーランド3Dのスキル一覧。どのスキルがどの特技をいくつのSPで覚えるか、どの種族が持っているかをまとめています。">
<!-- seo:start -->
<link rel="canonical" href="https://westory-ch.github.io/skills.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WeSTORY">
<meta property="og:title" content="スキル図鑑｜WeSTORY">
<meta property="og:description" content="テリーのワンダーランド3Dのスキル一覧。どのスキルがどの特技をいくつのSPで覚えるか、どの種族が持っているかをまとめています。">
<meta property="og:url" content="https://westory-ch.github.io/skills.html">
<meta property="og:image" content="https://westory-ch.github.io/assets/brand/logo_mark.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/brand/logo_mark.png" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<meta name="theme-color" content="#b08850">
<!-- seo:end -->
<link rel="stylesheet" href="assets/css/style.css?v=20260905131743">
</head>
<body>
<div class="wrap">

  <h1 class="page">スキル図鑑</h1>
  <p class="lead" style="margin-bottom:8px">
    モンスターが覚える<b>スキル</b>の一覧です。
  </p>
  <!-- ★2026-09-05 長い説明はたたむ -->
  <details class="fold">
    <summary>スキルとSPのしくみ</summary>
    <div class="fold-body">
      <p>スキルにはそれぞれ覚える<b>特技</b>があり、
      <b>自分のレベル＝SP</b>として自動でたまり（配合1回ごとに+6）、必要SPの少ないものから順番に覚えます。</p>
    </div>
  </details>

  <div class="panel" style="margin-bottom:16px">
    <h2 class="sec" style="margin-top:0">スキルポイント（SP）のきまり</h2>
    <div class="spgrid" id="spRules"></div>
    <p class="small muted" style="margin:12px 0 0" id="spConsult"></p>
  </div>

  <div class="panel soft" style="margin-bottom:16px">
    <div class="row">
      <input class="search" id="q" placeholder="スキル名・特技名・効果・モンスター名でさがす" oninput="renderList()" style="flex:1;min-width:220px">
      <select class="sel" id="sort" onchange="renderList()" style="width:auto">
        <option value="mons">持っている種族が多い順</option>
        <option value="name">名前順</option>
        <option value="tech">覚える特技が多い順</option>
      </select>
    </div>
    <p class="small muted" style="margin:8px 0 0" id="count"></p>
  </div>

  <div id="detail"></div>

  <section class="section">
    <h2 class="sec">スキル一覧</h2>
    <div class="grid g4" id="list"></div>
  </section>

</div>

<script src="data/site.js?v=20260905131743"></script>
<script src="data/monsters.js?v=20260905131743"></script>
<script src="data/teri.js?v=20260905131743"></script>
<script src="data/mondex.js?v=20260905131743"></script>
<script src="data/skills.js?v=20260905131743"></script>
<script src="data/episodes.js?v=20260905131743"></script>
<script src="data/goods.js?v=20260905131743"></script>
<script src="data/news.js?v=20260905131743"></script>
<script src="data/story.js?v=20260905131743"></script>
<script src="assets/js/app.js?v=20260905131743"></script>
<script>
var ALL=[], PICK='';

// 覚える特技は必要SPの少ない順（＝実際に覚える順）でならべる
function techsHtml(techs){
  var esc=App.esc;
  if(!techs||!techs.length) return '<div class="empty">覚える特技のデータがありません。</div>';
  return '<div class="techs">'+techs.slice().sort(function(a,b){return (a.sp||0)-(b.sp||0)}).map(function(t){
    return '<div class="tech"><span class="sp">'+esc(t.sp||0)+'</span>'+
      '<span class="nm">'+esc(t.t)+'</span>'+
      (t.e?'<span class="ef">'+esc(t.e)+'</span>':'')+'</div>';
  }).join('')+'</div>';
}

// その種族をうちの牧場で飼っていれば、詳細ページへつなぐ
function monLink(species){
  var esc=App.esc;
  var mine=App.MONSTERS.filter(function(m){return m.species===species})[0];
  return mine
    ? '<a class="badge gold" href="monster.html?id='+encodeURIComponent(mine.id)+'">'+esc(mine.name)+'（'+esc(species)+'）</a>'
    : '<span class="badge">'+esc(species)+'</span>';
}

function renderDetail(){
  var esc=App.esc, box=App.$('#detail');
  var s=ALL.filter(function(x){return x.name===PICK})[0];
  if(!s){ box.innerHTML=''; return; }
  box.innerHTML =
    '<section class="section"><div class="panel">'+
      '<div class="spread">'+
        '<h2 class="sec" style="margin:0">'+esc(s.name)+'</h2>'+
        '<button class="btn ghost sm" onclick="pick(\'\')">閉じる</button>'+
      '</div>'+
      '<p class="small muted" style="margin:6px 0 12px">'+
        '覚える特技 '+s.techs.length+'個 ／ このスキルを持つ種族 '+s.mons.length+'体 ／ '+
        '全部おぼえるのに必要なSP '+s.techs.reduce(function(n,t){return Math.max(n,t.sp||0)},0)+'</p>'+
      techsHtml(s.techs)+
      '<p class="small muted" style="margin:16px 0 6px">このスキルを持つモンスター</p>'+
      '<div class="row">'+s.mons.map(monLink).join('')+'</div>'+
    '</div></section>';
  box.scrollIntoView({behavior:'smooth',block:'start'});
}

function pick(name){
  PICK=(PICK===name?'':name);
  renderDetail();
  renderList();
  var u=location.pathname+(PICK?'?s='+encodeURIComponent(PICK):'');
  history.replaceState(null,'',u);
}

function renderList(){
  var esc=App.esc;
  var q=(App.$('#q').value||'').trim().toLowerCase(), sort=App.$('#sort').value;
  var list=ALL.filter(function(s){
    if(!q) return true;
    var hay=(s.name+' '+s.mons.join(' ')+' '+
      s.techs.map(function(t){return t.t+' '+t.e}).join(' ')).toLowerCase();
    return hay.indexOf(q)>=0;
  });
  if(sort==='name') list=list.slice().sort(function(a,b){return a.name.localeCompare(b.name,'ja')});
  if(sort==='tech') list=list.slice().sort(function(a,b){return b.techs.length-a.techs.length});
  App.$('#count').textContent='スキル '+ALL.length+'種類 ／ 特技 '+
    ALL.reduce(function(n,s){return n+s.techs.length},0)+'個'+
    (q?'　いま表示中：'+list.length+'種類':'');
  App.$('#list').innerHTML = list.length ? list.map(function(s){
    return '<div class="panel'+(s.name===PICK?' soft':'')+'" style="cursor:pointer" onclick="pick('+JSON.stringify(s.name).replace(/"/g,'&quot;')+')">'+
      '<b class="dot" style="font-size:17px">'+esc(s.name)+'</b>'+
      '<p class="small muted" style="margin:4px 0 8px">特技'+s.techs.length+'個 ／ '+s.mons.length+'体が持つ</p>'+
      '<div class="row">'+s.techs.slice()
        .sort(function(a,b){return (a.sp||0)-(b.sp||0)}).slice(0,3)
        .map(function(t){return '<span class="badge">'+esc(t.t)+'</span>'}).join('')+
        (s.techs.length>3?'<span class="badge">ほか'+(s.techs.length-3)+'個</span>':'')+
      '</div>'+
    '</div>';
  }).join('') : '<div class="empty" style="grid-column:1/-1">見つかりませんでした。</div>';
}

// SPの増えかた。数字は site.js の skillPoint が唯一の正解
function renderSp(){
  var sp=App.SITE.skillPoint||{};
  function card(ic,v,unit,k,note){
    return '<div class="spcard">'+App.icon(ic)+
      '<span class="v">'+v+'<small>'+unit+'</small></span>'+
      '<span class="k">'+k+'</span>'+
      '<span class="cap">'+note+'</span></div>';
  }
  App.$('#spRules').innerHTML=
    card('level','Lv＝','SP','自分のレベル＝スキルポイント',sp.levelNote||'')+
    card('breed','+'+sp.breedBonus,'SP','配合1回につき',sp.breedNote||'')+
    card('auto','自動','','加算（レベルが上がると反映）',sp.autoNote||'');
  App.$('#spConsult').innerHTML=(sp.maxNote?sp.maxNote+' ':'')+(sp.consultNote||'');
}
function pageInit(){
  renderSp();
  ALL=App.allSkills();
  PICK=App.qs('s')||'';
  renderDetail();
  renderList();
}
</script>
</body>
</html>
