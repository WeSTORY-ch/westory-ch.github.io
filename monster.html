<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>モンスター詳細｜WeSTORY</title>
<!-- seo:start -->
<link rel="canonical" href="https://westory-ch.github.io/monster.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WeSTORY">
<meta property="og:title" content="モンスター詳細｜WeSTORY">
<meta property="og:description" content="">
<meta property="og:url" content="https://westory-ch.github.io/monster.html">
<meta property="og:image" content="https://westory-ch.github.io/assets/brand/logo_mark.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/brand/logo_mark.png" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<meta name="theme-color" content="#b08850">
<!-- seo:end -->
<link rel="stylesheet" href="assets/css/style.css?v=20260903110815">
</head>
<body>
<div class="wrap" id="main"></div>

<script src="data/site.js?v=20260903110815"></script>
<script src="data/monsters.js?v=20260903110815"></script>
<script src="data/teri.js?v=20260903110815"></script>
<script src="data/mondex.js?v=20260903110815"></script>
<script src="data/skills.js?v=20260903110815"></script>
<script src="data/episodes.js?v=20260903110815"></script>
<script src="data/goods.js?v=20260903110815"></script>
<script src="data/news.js?v=20260903110815"></script>
<script src="data/story.js?v=20260903110815"></script>
<script src="assets/js/app.js?v=20260903110815"></script>
<script>
function pageInit(){
  var esc=App.esc, S=App.SITE;
  var m=App.getMon(App.qs('id'));
  if(!m){
    App.$('#main').innerHTML='<h1 class="page">見つかりません</h1><div class="empty">そのIDのモンスターは登録されていません。<br><a href="monsters.html">モンスター牧場へ戻る</a></div>';
    return;
  }
  document.title = m.name + ' | ' + (S.siteName||'');
  App.track.viewMonster(m);

  var father=m.parents?App.getMon(m.parents.father):null;
  var mother=m.parents?App.getMon(m.parents.mother):null;
  var kids=App.childrenOf(m.id);
  var eps=(m.episodes||[]).map(App.getEp).filter(Boolean)
          .sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
  var lvMax=Math.max(S.rules.breedMinLevel, m.level||0, 30);
  var openVoteEp = App.EPISODES.filter(function(e){
    return e.voteStatus==='受付中' && (e.monsters||[]).indexOf(m.id)>=0; })[0]
    || App.EPISODES.filter(function(e){return e.voteStatus==='受付中'})[0];

  // 種族図鑑（枠・耐性・限界値）と、その種族が持つスキル
  var dex=App.dexOf(m), dexSkills=App.skillsOf(m);
  // 覚える特技を必要SPの少ない順にならべる
  function techsHtml(techs){
    if(!techs||!techs.length) return '<div class="empty">覚える特技のデータがありません。</div>';
    return '<div class="techs">'+techs.slice().sort(function(a,b){return (a.sp||0)-(b.sp||0)}).map(function(t){
      return '<div class="tech"><span class="sp">'+esc(t.sp||0)+'</span>'+
        '<span class="nm">'+esc(t.t)+'</span>'+
        (t.e?'<span class="ef">'+esc(t.e)+'</span>':'')+'</div>';
    }).join('')+'</div>';
  }

  function nodeLink(x,label){
    if(!x) return '<span class="node" style="opacity:.5"><span class="em">'+App.icon('question')+'</span><span class="nm">不明</span><span class="sub">'+esc(label)+'</span></span>';
    return '<a class="node" href="monster.html?id='+encodeURIComponent(x.id)+'"><span class="em">'+App.monFace(x)+'</span><span class="nm">'+esc(x.name)+'</span><span class="sub">'+esc(label)+'</span></a>';
  }

  App.$('#main').innerHTML =
  '<p class="small muted" style="margin:18px 0 0"><a href="monsters.html">← モンスター牧場</a></p>'+

  '<div class="panel" style="margin-top:10px">'+
    '<div class="mhead">'+
      '<div class="portrait">'+App.monFace(m)+'</div>'+
      '<div style="flex:1;min-width:240px">'+
        '<div class="row small"><span class="fam '+esc(m.family)+'">'+esc(m.family)+'</span>'+
          '<span class="rank '+esc(m.rank)+'">ランク '+esc(m.rank)+'</span>'+
          '<span class="badge">'+esc(m.gender||'-')+'</span>'+
          '<span class="badge">'+esc(m.id)+'</span>'+
          (m.parents?'<span class="badge pink">配合で誕生</span>':'<span class="badge cyan">スカウト/初期メンバー</span>')+
        '</div>'+
        '<h1 class="dot" style="font-size:30px;margin:8px 0 2px">'+esc(m.name)+'</h1>'+
        '<p class="muted" style="margin:0 0 10px">'+esc(m.species)+'</p>'+
        '<div class="row" style="gap:10px">'+
          '<b class="dot" style="color:var(--gold);font-size:18px">Lv.'+esc(m.level||0)+'</b>'+
          '<div class="bar"><i style="width:'+Math.min(100,Math.round((m.level||0)/lvMax*100))+'%"></i></div>'+
        '</div>'+
        '<p class="small muted" style="margin:6px 0 0">'+
          (App.canBreed(m)
            ? '配合可能（Lv'+esc(S.rules.breedMinLevel)+'以上）'
            : '配合まであと '+(S.rules.breedMinLevel-(m.level||0))+'レベル ＝ 戦闘に あと'+App.winsToBreed(m)+'勝（1勝で+'+esc(S.rules.levelPerWin)+'）')+
        '</p>'+
        (m.note?'<p class="small" style="margin:10px 0 0">'+esc(m.note)+'</p>':'')+
      '</div>'+
    '</div>'+
  '</div>'+

  // 参加CTA
  '<section class="section"><div class="vote-box">'+
    '<h3>'+App.icon('like')+'この子に関わる募集</h3>'+
    '<div class="row">'+
      '<a class="btn gold" href="names.html">'+App.icon('pen')+'名前の募集を見る</a>'+
      (App.canBreed(m)?'<a class="btn gold" href="breed.html?parent='+encodeURIComponent(m.id)+'">'+App.icon('flask')+'配合表で相手を見る</a>':'')+
      '<a class="yt-btn" href="'+esc(App.ytWatch(openVoteEp))+'" target="_blank" rel="noopener">'+App.icon('youtube')+'動画のコメント欄へ</a>'+
    '</div>'+
    '<p class="small muted" style="margin:8px 0 0">'+
      '名前と次に戦う相手は<b>動画のコメント欄</b>、配合先と継承スキルは<b>このサイトに貼った応募フォーム</b>で受け付けます。'+
      'パーティの3体は制作者が決めます（要望はコメント欄を参考にします）。</p>'+
  '</div></section>'+

  // ステータス
  '<section class="section"><div class="grid g2" style="align-items:start">'+
    '<div class="panel"><h2 class="sec">プロフィール</h2>'+
      '<dl class="dl">'+
        '<dt>種族</dt><dd>'+esc(m.species)+'</dd>'+
        '<dt>系統</dt><dd>'+esc(m.family)+'</dd>'+
        '<dt>ランク</dt><dd>'+esc(m.rank)+'</dd>'+
        '<dt>性別</dt><dd>'+esc(m.gender||'-')+'</dd>'+
        '<dt>レベル</dt><dd>'+esc(m.level||0)+'</dd>'+
        '<dt>状態</dt><dd>'+esc(m.status||'現役')+'</dd>'+
        '<dt>初登場</dt><dd>'+(m.birthEp&&App.getEp(m.birthEp)?'<a href="'+esc(App.ytWatch(App.getEp(m.birthEp)))+'" target="_blank" rel="noopener">#'+esc(App.getEp(m.birthEp).no)+' '+esc(App.getEp(m.birthEp).title)+'</a>':'-')+'</dd>'+
        '<dt>特性</dt><dd>'+((m.traits||[]).length?(m.traits||[]).map(function(t){return '<span class="badge">'+esc(t)+'</span>'}).join(' '):'<span class="muted">なし</span>')+'</dd>'+
      '</dl>'+
    '</div>'+
    '<div class="panel"><h2 class="sec">スキル</h2>'+
      (dexSkills.length
        ? dexSkills.map(function(s){
            return '<div class="row" style="justify-content:space-between;align-items:baseline">'+
                '<b class="dot" style="font-size:19px">'+esc(s.name)+'</b>'+
                '<a class="small" href="skills.html?s='+encodeURIComponent(s.name)+'">くわしく →</a>'+
              '</div>'+
              '<p class="small muted" style="margin:4px 0 10px">'+
                esc(m.species)+' はこのスキルを持っています。SPをためると上から順に'+s.techs.length+'個の特技を覚えます。</p>'+
              techsHtml(s.techs);
          }).join('')
        : ((m.skills||[]).length
          ? '<div class="grid" style="gap:8px">'+(m.skills||[]).map(function(s){
              return '<div class="skill"><b>'+esc(s.name)+'</b><div class="small muted">'+esc(s.desc||'')+'</div></div>';
            }).join('')+'</div>'
          : '<div class="empty">この種族のスキルはまだ登録されていません。</div>'))+
    '</div>'+
  '</div></section>'+

  // 種族データ（テリーのワンダーランド3D の実データ）
  (dex
    ? '<section class="section"><div class="spread">'+
        '<h2 class="sec">'+esc(m.species)+' の種族データ</h2>'+
        '<span class="small muted">テリーのワンダーランド3D の数値です</span>'+
      '</div>'+
      '<div class="grid g2" style="align-items:start">'+
        '<div class="panel"><h3 class="sec" style="font-size:15px">限界値（レベル最大のときの上限）</h3>'+
          (dex.max&&dex.max.hp
            ? '<div class="limits">'+[['HP','hp'],['MP','mp'],['こうげき','atk'],['しゅび','def'],['すばやさ','spd'],['かしこさ','int']].map(function(p){
                var v=dex.max[p[1]]||0;
                return '<span class="k">'+p[0]+'</span>'+
                  '<span class="bar"><i style="width:'+Math.min(100,Math.round(v/1000*100))+'%"></i></span>'+
                  '<span class="v">'+v+'</span>';
              }).join('')+'</div>'
            : '<div class="empty">限界値の記載がありません。</div>')+
          '<dl class="dl" style="margin-top:14px">'+
            '<dt>枠</dt><dd>'+esc(dex.waku||'-')+'</dd>'+
            '<dt>スカウト</dt><dd>'+(dex.scout?'できる':'できない（配合などで仲間にする）')+'</dd>'+
            '<dt>装備</dt><dd>'+(dex.weapon.length?dex.weapon.map(function(w){return '<span class="badge">'+esc(w)+'</span>'}).join(' '):'<span class="muted">なし</span>')+'</dd>'+
          '</dl>'+
        '</div>'+
        '<div class="panel"><h3 class="sec" style="font-size:15px">特性と耐性</h3>'+
          '<p class="small muted" style="margin:0 0 6px">特性</p>'+
          '<div class="row">'+(dex.traits.length?dex.traits.map(function(t){return '<span class="badge">'+esc(t)+'</span>'}).join(''):'<span class="muted small">なし</span>')+'</div>'+
          '<p class="small muted" style="margin:14px 0 6px">耐性</p>'+
          (dex.resist.length?'<ul class="small" style="margin:0;padding-left:18px;line-height:1.9">'+dex.resist.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>':'<span class="muted small">記載なし</span>')+
          '<p class="small muted" style="margin:14px 0 6px">出現する場所</p>'+
          '<div class="row">'+(dex.place.length?dex.place.map(function(t){return '<span class="badge cyan">'+esc(t)+'</span>'}).join(''):'<span class="muted small">記載なし</span>')+'</div>'+
        '</div>'+
      '</div></section>'
    : '')+

  // 家系図
  '<section class="section"><div class="panel">'+
    '<div class="spread"><h2 class="sec">家系</h2><a class="btn ghost sm" href="tree.html?id='+encodeURIComponent(m.id)+'">家系図で見る →</a></div>'+
    '<div class="tree-scroll"><div class="tree">'+
      (m.parents
        ? '<div class="row" style="justify-content:center;gap:26px">'+nodeLink(father,'父')+'<span class="dot" style="font-size:24px;color:var(--gold);align-self:center">×</span>'+nodeLink(mother,'母')+'</div>'+
          '<div style="width:2px;height:24px;background:var(--line-soft)"></div>'
        : '<p class="small muted" style="margin:0 0 10px">初期メンバー／スカウト個体のため両親はいません。</p>')+
      '<span class="node me"><span class="em">'+App.monFace(m)+'</span><span class="nm">'+esc(m.name)+'</span><span class="sub">Lv.'+esc(m.level||0)+'</span></span>'+
      (kids.length
        ? '<ul class="'+(kids.length===1?'single':'')+'">'+kids.map(function(k){
            return '<li class="'+(kids.length===1?'only':'')+'"><a class="node" href="monster.html?id='+encodeURIComponent(k.id)+'"><span class="em">'+App.monFace(k)+'</span><span class="nm">'+esc(k.name)+'</span><span class="sub">こども</span></a></li>';
          }).join('')+'</ul>'
        : '')+
    '</div></div>'+
    (kids.length?'':'<p class="small muted" style="margin:8px 0 0;text-align:center">まだ子どもはいません。</p>')+
  '</div></section>'+

  // 登場エピソード
  '<section class="section">'+
    '<h2 class="sec">登場エピソード（'+eps.length+'本）</h2>'+
    (eps.length?'<div class="grid g4">'+eps.map(App.episodeCardHtml).join('')+'</div>':'<div class="empty">登場エピソードはまだありません。</div>')+
  '</section>'+

  // 関連グッズ
  '<section class="section">'+
    '<div class="spread"><h2 class="sec">'+esc(m.name)+' が好きな人におすすめ</h2><a class="btn ghost sm" href="goods.html">グッズ一覧 →</a></div>'+
    '<p class="pr-note">PR：アフィリエイト広告を含みます。このモンスターの系統・タグに合わせて表示しています。</p>'+
    '<div class="grid g4">'+App.recommendGoods(4,(m.tags||[]).concat([m.family])).map(App.goodsCardHtml).join('')+'</div>'+
  '</section>';

}
</script>
</body>
</html>
